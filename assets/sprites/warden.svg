<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8be9c"/>
      <stop offset="0.6" stop-color="#8a9078"/>
      <stop offset="1" stop-color="#5e6450"/>
    </linearGradient>
    <radialGradient id="stoneLight" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#c8ceac"/>
      <stop offset="1" stop-color="#7a8068"/>
    </radialGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="400" cy="750" rx="240" ry="44" fill="#000" opacity="0.35"/>
  </g>
  <g id="legs" stroke="#23263a" stroke-width="10">
    <rect x="286" y="540" width="104" height="170" rx="36" fill="url(#stone)"/>
    <rect x="410" y="540" width="104" height="170" rx="36" fill="url(#stone)"/>
  </g>
  <g id="body" stroke="#23263a" stroke-width="10">
    <rect x="272" y="290" width="256" height="300" rx="70" fill="url(#stoneLight)"/>
    <g id="moss" stroke="none">
      <ellipse cx="330" cy="350" rx="34" ry="24" fill="#4a8a30" opacity="0.8"/>
      <ellipse cx="474" cy="430" rx="40" ry="28" fill="#4a8a30" opacity="0.7"/>
      <ellipse cx="352" cy="520" rx="28" ry="20" fill="#3c7a26" opacity="0.75"/>
      <ellipse cx="452" cy="330" rx="24" ry="16" fill="#4a8a30" opacity="0.6"/>
    </g>
    <g id="cracks" fill="none" stroke-linecap="round" stroke-width="6" opacity="0.7">
      <path d="M 380 420 L 396 448 L 384 478"/>
      <path d="M 440 480 L 428 508"/>
    </g>
  </g>
  <g id="arms" stroke="#23263a" stroke-width="10">
    <rect x="188" y="300" width="88" height="230" rx="40" fill="url(#stone)"/>
    <rect x="524" y="300" width="88" height="230" rx="40" fill="url(#stone)"/>
    <circle cx="232" cy="560" r="52" fill="url(#stoneLight)"/>
    <circle cx="568" cy="560" r="52" fill="url(#stoneLight)"/>
  </g>
  <g id="head" stroke="#23263a" stroke-width="10">
    <rect x="330" y="150" width="140" height="120" rx="34" fill="url(#stoneLight)"/>
    <ellipse cx="368" cy="216" rx="18" ry="24" fill="#e8a020" stroke="none"/>
    <ellipse cx="432" cy="216" rx="18" ry="24" fill="#e8a020" stroke="none"/>
    <circle cx="368" cy="216" r="34" fill="#e8a020" opacity="0.25" stroke="none"/>
    <circle cx="432" cy="216" r="34" fill="#e8a020" opacity="0.25" stroke="none"/>
  </g>
</svg>
