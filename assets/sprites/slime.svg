<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="gloop" cx="0.4" cy="0.3" r="1">
      <stop offset="0" stop-color="#8ee86a"/>
      <stop offset="0.65" stop-color="#4cc04c"/>
      <stop offset="1" stop-color="#2a8a38"/>
    </radialGradient>
    <radialGradient id="puddle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4cc04c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2a8a38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8f0c8"/>
    </radialGradient>
  </defs>
  <g id="shadow">
    <ellipse cx="400" cy="690" rx="260" ry="46" fill="#000" opacity="0.35"/>
  </g>
  <g id="puddle">
    <ellipse cx="400" cy="670" rx="250" ry="52" fill="url(#puddle)"/>
  </g>
  <g id="body" stroke="#1c4a24" stroke-width="10">
    <!-- one rounded blob, drawn with smooth cubic beziers -->
    <path fill="url(#gloop)" d="
      M 400 240
      C 520 240 620 330 640 450
      C 655 545 600 640 490 665
      C 445 676 355 676 310 665
      C 200 640 145 545 160 450
      C 180 330 280 240 400 240
      Z"/>
    <g id="sheen" stroke="none" opacity="0.55">
      <ellipse cx="300" cy="360" rx="58" ry="36" fill="#c8f0a8" transform="rotate(-28 300 360)"/>
      <ellipse cx="520" cy="600" rx="40" ry="22" fill="#2a7a34" transform="rotate(-12 520 600)"/>
      <ellipse cx="250" cy="560" rx="34" ry="20" fill="#2a7a34" transform="rotate(18 250 560)"/>
    </g>
    <g id="bumps" stroke="none" opacity="0.5">
      <circle cx="560" cy="400" r="26" fill="#a8e888"/>
      <circle cx="270" cy="440" r="20" fill="#a8e888"/>
    </g>
  </g>
  <g id="face">
    <g id="eyes" stroke="#1c4a24" stroke-width="7">
      <ellipse cx="330" cy="470" rx="48" ry="56" fill="url(#eye)"/>
      <ellipse cx="470" cy="470" rx="48" ry="56" fill="url(#eye)"/>
      <circle cx="342" cy="486" r="22" fill="#22303a" stroke="none"/>
      <circle cx="458" cy="486" r="22" fill="#22303a" stroke="none"/>
      <circle cx="350" cy="478" r="7" fill="#fff" stroke="none"/>
      <circle cx="466" cy="478" r="7" fill="#fff" stroke="none"/>
    </g>
    <path id="mouth" d="M 362 570 Q 400 596 438 570" fill="none" stroke="#1c4a24" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g id="drip" stroke="none">
    <path d="M 236 640 C 236 664 226 676 226 690 C 226 702 244 702 244 690 C 244 676 252 664 252 640 Z" fill="#4cc04c"/>
    <path d="M 556 648 C 556 670 548 680 548 692 C 548 703 564 703 564 692 C 564 680 570 670 570 648 Z" fill="#4cc04c" opacity="0.85"/>
  </g>
