      <path d="M 400 420 L 445 500 L 400 590 L 355 500 Z" fill="#7a68b0" opacity="0.8"/>
      <ellipse cx="330" cy="430" rx="30" ry="22" fill="#8a78c0" opacity="0.5"/>
      <ellipse cx="475" cy="430" rx="30" ry="22" fill="#8a78c0" opacity="0.5"/>
      <ellipse cx="320" cy="560" rx="26" ry="18" fill="#2a2050" opacity="0.6"/>
      <ellipse cx="480" cy="560" rx="26" ry="18" fill="#2a2050" opacity="0.6"/>
    </g>
    <!-- egg sac the queen carries -->
    <g id="eggs">
