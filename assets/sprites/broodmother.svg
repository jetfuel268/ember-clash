    <path d="M 320 430 Q 180 360 130 250" stroke="#1a1430" stroke-width="34"/>
    <path d="M 320 430 Q 180 360 130 250" stroke="#3a2a60" stroke-width="16"/>
    <path d="M 310 480 Q 150 470 80 420" stroke="#1a1430" stroke-width="34"/>
    <path d="M 310 480 Q 150 470 80 420" stroke="#3a2a60" stroke-width="16"/>
    <path d="M 315 530 Q 170 600 140 680" stroke="#1a1430" stroke-width="34"/>
    <path d="M 315 530 Q 170 600 140 680" stroke="#3a2a60" stroke-width="16"/>
    <path d="M 335 575 Q 260 660 250 730" stroke="#1a1430" stroke-width="34"/>
    <path d="M 335 575 Q 260 660 250 730" stroke="#3a2a60" stroke-width="16"/>
    <!-- right side -->
    <path d="M 480 430 Q 620 360 670 250" stroke="#1a1430" stroke-width="34"/>
    <path d="M 480 430 Q 620 360 670 250" stroke="#3a2a60" stroke-width="16"/>
    <path d="M 490 480 Q 650 470 720 420" stroke="#1a1430" stroke-width="34"/>
    <path d="M 490 480 Q 650 470 720 420" stroke="#3a2a60" stroke-width="16"/>
    <path d="M 485 530 Q 630 600 660 680" stroke="#1a1430" stroke-width="34"/>
    <path d="M 485 530 Q 630 600 660 680" stroke="#3a2a60" stroke-width="16"/>
    <path d="M 465 575 Q 540 660 550 730" stroke="#1a1430" stroke-width="34"/>
    <path d="M 465 575 Q 540 660 550 730" stroke="#3a2a60" stroke-width="16"/>
  </g>
  <g id="body" stroke="#14102a" stroke-width="10">
