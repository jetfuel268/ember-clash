<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="abdomen" cx="0.38" cy="0.3" r="1">
      <stop offset="0" stop-color="#5a4a8a"/>
      <stop offset="0.6" stop-color="#3a2a60"/>
      <stop offset="1" stop-color="#241a40"/>
    </radialGradient>
    <radialGradient id="skull" cx="0.4" cy="0.35" r="1">
      <stop offset="0" stop-color="#4a3a70"/>
      <stop offset="1" stop-color="#2a1e48"/>
    </radialGradient>
    <radialGradient id="eyeglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="0.7" stop-color="#c02020"/>
      <stop offset="1" stop-color="#801010"/>
    </radialGradient>
    <radialGradient id="egg" cx="0.4" cy="0.35" r="1">
