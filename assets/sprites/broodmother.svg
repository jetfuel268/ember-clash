      <circle cx="352" cy="648" r="26" fill="url(#egg)" stroke="#14102a" stroke-width="8"/>
      <circle cx="448" cy="648" r="26" fill="url(#egg)" stroke="#14102a" stroke-width="8"/>
    </g>
  </g>
  <g id="head" stroke="#14102a" stroke-width="9">
