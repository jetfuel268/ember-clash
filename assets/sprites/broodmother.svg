    <g id="crown" stroke="none">
      <path d="M 330 235 L 345 185 L 368 215 L 392 168 L 400 160 L 408 168 L 432 215 L 455 185 L 470 235 Q 400 215 330 235 Z" fill="#d8a838"/>
      <circle cx="400" cy="222" r="8" fill="#c04848"/>
      <circle cx="362" cy="228" r="6" fill="#48a0c0"/>
      <circle cx="438" cy="228" r="6" fill="#48a0c0"/>
    </g>
    <g id="eyes" stroke="none">
      <!-- eight glowing eyes -->
      <circle cx="352" cy="280" r="13" fill="url(#eyeglow)"/>
      <circle cx="448" cy="280" r="13" fill="url(#eyeglow)"/>
      <circle cx="336" cy="310" r="10" fill="url(#eyeglow)"/>
      <circle cx="464" cy="310" r="10" fill="url(#eyeglow)"/>
      <circle cx="378" cy="322" r="9" fill="url(#eyeglow)"/>
      <circle cx="422" cy="322" r="9" fill="url(#eyeglow)"/>
      <circle cx="352" cy="280" r="5" fill="#ffd0d0"/>
      <circle cx="448" cy="280" r="5" fill="#ffd0d0"/>
    </g>
  </g>
  <g id="fangs" stroke="#14102a" stroke-width="7" fill="#e8e0f0">
    <path d="M 372 356 C 366 390 362 412 372 434 C 380 414 382 390 384 358 Z"/>
    <path d="M 428 356 C 434 390 438 412 428 434 C 420 414 418 390 416 358 Z"/>
  </g>
